<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Шейкер — тренажёр бармена</title>
<style>
:root{--bg:#14110F;--card:#1F1A17;--card2:#2A241F;--line:#3A322B;--text:#F4EDE3;--muted:#B8AC9C;--acc:#E8A33D;--accInk:#14110F;--ok:#9BE3A5;--okBg:#1F3A26;--bad:#FFB4A6;--badBg:#4A211B;--heart:#FF8A73}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:500 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 32px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:26px;font-weight:800;line-height:1.2}
h2{margin:0;font-size:18px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--acc);text-transform:uppercase}
.card{background:var(--card);border-radius:20px;padding:16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{min-height:52px;border-radius:16px;border:none;background:var(--acc);color:var(--accInk);font-weight:800;font-size:17px;padding:0 18px;width:100%}
.btn.sec{background:var(--card2);color:var(--text)}
.icon{width:44px;height:44px;border-radius:22px;border:none;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;padding:8px 10px;text-align:center}
.opt:active{border-color:var(--acc)}
.opt.wide{grid-column:1/-1;text-align:left;padding:10px 14px}
.opt .sub{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.bar{flex:1;height:14px;border-radius:7px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:7px;transition:width .25s}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:none;border-radius:16px;padding:12px 14px;min-height:60px}
.tile[disabled]{opacity:.45;cursor:default}
.tile .nm{font-weight:800;font-size:17px}
.stars{display:flex;gap:2px}
.msg{border-radius:16px;padding:12px 16px;font-weight:700;min-height:48px;display:flex;align-items:center;background:var(--card);color:var(--muted)}
.msg.ok{background:var(--okBg);color:var(--ok)}
.msg.bad{background:var(--badBg);color:var(--bad)}
.stage{display:flex;align-items:center;gap:14px;min-height:150px}
.stage svg{flex-shrink:0}
.steps{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:6px}
.chip{display:inline-block;background:var(--card2);border-radius:10px;padding:4px 10px;font-size:14px;font-weight:700;margin:2px 4px 2px 0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:none;border-radius:16px;padding:14px 16px;width:100%;text-align:left}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--text);transition:left .2s}
.sw.on{background:var(--acc)}.sw.on::after{left:23px;background:var(--accInk)}
.foot{font-size:13px;color:var(--muted);text-align:center}
#app.withtabs{padding-bottom:96px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;z-index:5}
.tabs button{flex:1;max-width:220px;min-height:52px;border:none;border-radius:14px;background:transparent;color:var(--muted);font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button.on{background:var(--card2);color:var(--acc)}
.scene{display:block;width:100%;height:auto;border-radius:20px;background:#1A1512}
.scene [data-act]{cursor:pointer}
.up{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px}
.up .btn{width:auto;min-height:44px;font-size:15px;padding:0 14px;white-space:nowrap}
.up .own{color:var(--ok);font-weight:800;font-size:15px;white-space:nowrap}
.coin{display:inline-flex;align-items:center;gap:5px;font-weight:800}
.glassopt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px}
.bottles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bt{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 4px;font-weight:700;font-size:13px;line-height:1.2;min-height:112px}
.bt:active{border-color:var(--acc)}
.pourstage{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:56px}
.btlwrap{position:absolute;top:6px;left:50%;margin-left:46px;transform-origin:20% 90%;transition:transform .25s}
.btlwrap.on{transform:rotate(-115deg) translate(-6px,-20px)}
.stream{display:none;position:absolute;left:calc(50% - 18px);top:92px;width:5px;height:112px;border-radius:3px}
.btlwrap.on ~ .stream{display:block}
.cnt{font-size:34px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.hold{min-height:72px;width:100%;border:none;border-radius:20px;background:var(--acc);color:var(--accInk);font-weight:800;font-size:19px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.hold.sec{background:var(--card2);color:var(--text)}
.hold.on{transform:scale(.97);filter:brightness(1.1)}
.gest{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:280px;width:100%;background:var(--card);border:2px dashed var(--line);border-radius:20px;touch-action:none;user-select:none;-webkit-user-select:none;padding:16px;color:var(--text)}
.gest svg{transition:transform .08s}
.gtxt{font-weight:700;color:var(--muted);text-align:center}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div id="app"></div>
<script>

  { id: 'sunrise', n: 'Текила Санрайз', grp: 0, g: ['highball'], m: 'build', gar: ['Половинка дольки апельсина', 'Апельсиновая цедра'], s: [['Текила', 45], ['Апельсиновый сок', 90], ['Гренадин', 15]], tip: 'Гренадин льют последним и не перемешивают: так получается «рассвет».' },

  return '<div class="row"><button class="icon" data-act="home" aria-label="Назад">' + ICON.back + '</button><h1>Настройки</h1></div>' +
    '<button class="toggle" data-act="hints"><span><b>Подсказки для новичков</b><span class="muted" style="display:block;font-size:14px">Напоминание в игре, что ошибка покажет ответ</span></span><span class="sw' + (S.hints ? ' on' : '') + '"></span></button>' +
    '<div class="card"><h2>О рецептах</h2><p class="muted" style="margin-top:6px">Рецепты взяты из официального списка Международной ассоциации барменов (IBA). В барах встречаются авторские варианты: тренажёр учит базовой классике.</p></div>' +
    '<button class="btn sec" data-act="reset">' + (V.confirmReset ? 'Точно сбросить? Нажми ещё раз' : 'Сбросить прогресс') + '</button>' +
    '<p class="foot">Шейкер · данные хранятся только на этом телефоне</p>';
}
function render(shake) {
  if (G && G._off) G._off();
  let h;
  if (!S.adult) h = renderGate();
  else if (V.scr === 'study') h = renderStudy();
  else if (V.scr === 'game') h = (G.step === 'done' || G.step === 'fail') ? renderEnd() : renderGame();
  else if (V.scr === 'settings') h = renderSettings();
  else if (V.scr === 'bar') h = renderBar() + tabs();
  else h = renderHome() + tabs();
  $app.innerHTML = h;
  $app.classList.toggle('withtabs', S.adult && (V.scr === 'home' || V.scr === 'bar'));
  if (shake) { const m = document.getElementById('msg'); if (m) { m.classList.add('shake'); } if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {} }
  if (!shake && V.scr !== 'game') window.scrollTo(0, 0);
  bindGame();
}
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a !== 'reset') V.confirmReset = false;
  if (a === 'adult') { S.adult = true; save(); render(); }
  else if (a === 'home' || a === 'quit') { V.scr = 'home'; G = null; render(); }
  else if (a === 'open') { V.back = V.scr === 'bar' ? 'bar' : 'home'; V.scr = 'study'; V.cid = b.dataset.id; render(); }
  else if (a === 'tab') { V.scr = b.dataset.to; render(); }
  else if (a === 'buy') {
    const u = UPGRADES.find(x => x.id === b.dataset.id);
    if (u && !S.up[u.id] && S.tips >= u.price && (!u.need || S.up[u.need])) { S.tips -= u.price; S.up[u.id] = 1; save(); render(); }
  }
  else if (a === 'play') startGame(b.dataset.id);
  else if (a === 'weak') startGame(weakOne());
  else if (a === 'pick') pick(+b.dataset.i);
  else if (a === 'tapadd' && G && G.step === 'pour') { G.cur++; document.getElementById('cnt').textContent = countText(); document.getElementById('vsl').innerHTML = vesselInner(pourExtra()); if (navigator.vibrate) try { navigator.vibrate(20); } catch (x) {} }
  else if (a === 'tapdone' && G && G.step === 'pour') judgePour();
  else if (a === 'mud' && G && G.step === 'muddle') {
    G.cur++; const n = document.getElementById('cntm'); if (n) n.textContent = G.cur;
    const md = document.getElementById('mdl'); if (md) { md.setAttribute('transform', 'translate(0 22)'); setTimeout(() => md.setAttribute('transform', ''), 110); }
    if (navigator.vibrate) try { navigator.vibrate(30); } catch (x) {}
    if (G.cur >= 6) { G.cur = 0; finishAction(); }
  }
  else if (a === 'settings') { V.scr = 'settings'; render(); }
  else if (a === 'hints') { S.hints = !S.hints; save(); render(); }
  else if (a === 'reset') {
    if (!V.confirmReset) { V.confirmReset = true; render(); }
    else { S.best = {}; S.xp = 0; S.streak = 0; S.lastDay = ''; S.tips = 0; S.up = {}; V.confirmReset = false; save(); V.scr = 'home'; render(); }
  }
});
render();
if ('serviceWorker' in navigator && !false) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
